<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock AI</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0a;--surface:#141414;--surface2:#1c1c1c;--border:#262626;
  --text:#f0f0f0;--text2:#666;--accent:#4ade80;--red:#f87171;
  --blue:#60a5fa;--yellow:#facc15;
}
body{background:var(--bg);color:var(--text);font-family:'Pretendard',-apple-system,system-ui,sans-serif;min-height:100vh}

/* Header */
.header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:20;gap:12px}
.logo{font-size:17px;font-weight:800;letter-spacing:-0.02em;flex-shrink:0}
.logo span{color:var(--accent)}
.header-mid{display:flex;align-items:center;gap:8px;flex:1;max-width:340px}
.add-input{flex:1;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:9px 14px;font-size:14px;border-radius:7px;outline:none;font-family:inherit;transition:border-color 0.2s}
.add-input::placeholder{color:var(--text2)}
.add-input:focus{border-color:var(--accent)}
.add-btn{background:var(--accent);color:#000;border:none;padding:9px 14px;font-size:14px;font-weight:700;border-radius:7px;cursor:pointer;white-space:nowrap;font-family:inherit;transition:opacity 0.2s;flex-shrink:0}
.add-btn:hover{opacity:0.85}
.add-btn:disabled{opacity:0.4;cursor:not-allowed}
.header-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.live-badge{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--accent);font-weight:600}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.btn-sm{background:none;border:1px solid var(--border);color:var(--text2);padding:7px 12px;font-size:12px;cursor:pointer;border-radius:6px;font-family:inherit;transition:all 0.2s}
.btn-sm:hover{border-color:var(--text2);color:var(--text)}

/* Tabs */
.tabs-wrap{padding:16px 20px 0;max-width:1200px;margin:0 auto}
.tabs{display:flex;gap:4px}
.tab{background:none;border:none;color:var(--text2);padding:8px 16px;font-size:14px;font-weight:600;cursor:pointer;border-radius:6px;font-family:inherit;transition:all 0.2s}
.tab:hover{color:var(--text)}
.tab.active{background:var(--surface2);color:var(--text)}

/* Dashboard grid */
.dash-wrap{max-width:1200px;margin:0 auto;padding:16px 20px 60px}
.dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
@media(max-width:520px){.dash-grid{grid-template-columns:1fr}}

/* Stock mini card */
.stock-mini{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;cursor:pointer;transition:border-color 0.2s,transform 0.15s;position:relative}
.stock-mini:hover{border-color:#444;transform:translateY(-1px)}
.stock-mini.selected{border-color:var(--accent)}
.mini-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.mini-name{font-size:15px;font-weight:800;line-height:1.2}
.mini-ticker{font-size:11px;color:var(--text2);font-weight:600;margin-top:2px}
.mini-price-wrap{text-align:right}
.mini-price{font-size:16px;font-weight:800;letter-spacing:-0.01em}
.mini-change{font-size:12px;font-weight:600;margin-top:2px}
.mini-chart{height:50px;margin-bottom:10px}
.mini-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--text2)}
.mini-meta span b{color:var(--text);font-weight:700}
.mini-remove{position:absolute;top:8px;right:8px;background:none;border:none;color:var(--text2);cursor:pointer;padding:4px;border-radius:4px;display:none;font-size:14px;line-height:1;transition:color 0.2s}
.stock-mini:hover .mini-remove{display:block}
.mini-remove:hover{color:var(--red)}
.mini-loading{display:flex;align-items:center;justify-content:center;height:120px;color:var(--text2);font-size:13px;gap:8px}
.up{color:var(--accent)} .down{color:var(--red)}

/* Detail panel */
.detail-panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:16px;display:none}
.detail-panel.open{display:block}
.detail-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;gap:12px}
.detail-name-wrap{}
.detail-ticker{font-size:12px;color:var(--text2);font-weight:600;letter-spacing:.08em;margin-bottom:4px}
.detail-name{font-size:22px;font-weight:800}
.detail-price-wrap{text-align:right;flex-shrink:0}
.detail-price{font-size:26px;font-weight:800;letter-spacing:-0.02em}
.detail-change{font-size:14px;font-weight:600;margin-top:2px}
.detail-time{font-size:11px;color:var(--text2);margin-top:3px}
.detail-chart{height:150px;margin-bottom:20px}
.detail-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding-top:16px;border-top:1px solid var(--border)}
@media(max-width:480px){.detail-meta{grid-template-columns:repeat(2,1fr)}}
.meta-item .meta-label{font-size:11px;color:var(--text2);font-weight:600;letter-spacing:.06em;margin-bottom:3px}
.meta-item .meta-value{font-size:14px;font-weight:700}
.detail-close{background:none;border:1px solid var(--border);color:var(--text2);padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;border-radius:6px;font-family:inherit;transition:all 0.2s;margin-top:16px}
.detail-close:hover{border-color:var(--text2);color:var(--text)}
.watch-btn{display:flex;align-items:center;gap:6px;background:none;border:1px solid var(--border);color:var(--text2);padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;border-radius:6px;font-family:inherit;transition:all 0.2s;margin-top:16px}
.watch-btn:hover,.watch-btn.watching{border-color:var(--yellow);color:var(--yellow)}

/* AI section */
.ai-section{margin-top:20px;padding-top:20px;border-top:1px solid var(--border)}
.ai-header-row{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.ai-badge{background:var(--accent);color:#000;font-size:10px;font-weight:800;letter-spacing:.1em;padding:3px 7px;border-radius:4px}
.ai-title{font-size:14px;font-weight:700}
.verdict{display:flex;align-items:center;gap:12px;padding:14px;background:var(--surface2);border-radius:8px;margin-bottom:12px}
.verdict-badge{font-size:18px;font-weight:900;padding:8px 16px;border-radius:7px;white-space:nowrap}
.verdict-buy{background:rgba(74,222,128,.15);color:var(--accent)}
.verdict-sell{background:rgba(248,113,113,.15);color:var(--red)}
.verdict-hold{background:rgba(250,204,21,.15);color:var(--yellow)}
.verdict-text{font-size:13px;color:var(--text2);line-height:1.5}
.uv-row{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface2);border-radius:8px;margin-bottom:12px}
.uv-label{font-size:11px;color:var(--text2);font-weight:600;flex-shrink:0;width:60px}
.uv-bar-wrap{flex:1;height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.uv-bar{height:100%;border-radius:3px;transition:width .6s}
.uv-score{font-size:13px;font-weight:800;width:34px;text-align:right;flex-shrink:0}
.factors-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
@media(max-width:480px){.factors-grid{grid-template-columns:1fr}}
.factor-box{background:var(--surface2);border-radius:8px;padding:14px}
.factor-label{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.06em;margin-bottom:10px}
.label-pos{color:var(--accent)} .label-neg{color:var(--red)}
.factor-list{list-style:none;display:flex;flex-direction:column;gap:6px}
.factor-list li{font-size:12px;color:var(--text2);line-height:1.5;padding-left:12px;position:relative}
.factor-list li::before{content:'·';position:absolute;left:0}
.outlook-box{background:var(--surface2);border-radius:8px;padding:14px}
.outlook-label{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--blue);margin-bottom:8px}
.outlook-text{font-size:13px;color:var(--text2);line-height:1.6}
.ai-loading{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text2);padding:8px 0}
.spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error-box{background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.3);color:var(--red);padding:12px 16px;border-radius:8px;font-size:13px;line-height:1.5}

/* Empty state */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:60px 20px;color:var(--text2);text-align:center}
.empty-state p{font-size:14px;line-height:1.6}

/* Screener */
.screener-wrap{max-width:800px;margin:0 auto;padding:16px 20px 60px}
.screener-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px}
.screener-title{font-size:15px;font-weight:700;margin-bottom:6px}
.screener-desc{font-size:13px;color:var(--text2);margin-bottom:18px;line-height:1.5}
.screener-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.screener-input{flex:1;min-width:200px;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:10px 14px;font-size:14px;border-radius:7px;outline:none;font-family:inherit;transition:border-color 0.2s}
.screener-input:focus{border-color:var(--accent)}
.screener-btn{background:var(--accent);color:#000;border:none;padding:10px 18px;font-size:14px;font-weight:700;border-radius:7px;cursor:pointer;font-family:inherit;transition:opacity 0.2s;white-space:nowrap}
.screener-btn:hover{opacity:.85}
.screener-btn:disabled{opacity:.4;cursor:not-allowed}
.screener-results{display:flex;flex-direction:column;gap:10px}
.screener-item{background:var(--surface2);border-radius:8px;padding:16px;cursor:pointer;border:1px solid transparent;transition:border-color 0.2s}
.screener-item:hover{border-color:var(--accent)}
.screener-item-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.screener-item-name{font-size:15px;font-weight:700}
.screener-item-sub{font-size:12px;color:var(--text2);font-weight:400;margin-left:6px}
.s-score{font-size:12px;font-weight:700;padding:3px 10px;border-radius:4px}
.s-high{background:rgba(74,222,128,.15);color:var(--accent)}
.s-mid{background:rgba(250,204,21,.15);color:var(--yellow)}
.s-low{background:rgba(248,113,113,.15);color:var(--red)}
.screener-metrics{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text2)}
.screener-metrics span{color:var(--text);font-weight:600;margin-left:3px}
.screener-reason{font-size:12px;color:var(--text2);margin-top:8px;padding-top:8px;border-top:1px solid var(--border);line-height:1.5}

/* Modal */
.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;align-items:center;justify-content:center;padding:24px}
.modal-backdrop.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:28px;width:100%;max-width:440px}
.modal-title{font-size:18px;font-weight:800;margin-bottom:6px}
.modal-desc{font-size:13px;color:var(--text2);margin-bottom:20px;line-height:1.5}
.modal label{display:block;font-size:13px;color:var(--text2);font-weight:600;margin-bottom:8px}
.modal input{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:12px 14px;font-size:14px;border-radius:8px;outline:none;font-family:monospace;transition:border-color 0.2s;margin-bottom:20px}
.modal input:focus{border-color:var(--accent)}
.modal-actions{display:flex;gap:10px;justify-content:flex-end}
.btn-cancel{background:none;border:1px solid var(--border);color:var(--text2);padding:10px 18px;font-size:14px;font-weight:600;border-radius:8px;cursor:pointer;font-family:inherit}
.btn-cancel:hover{border-color:var(--text2);color:var(--text)}
.btn-save{background:var(--accent);border:none;color:#000;padding:10px 22px;font-size:14px;font-weight:700;border-radius:8px;cursor:pointer;font-family:inherit}
.btn-save:hover{opacity:.85}
</style>
</head>
<body>

<div class="header">
  <div class="logo">Stock<span>AI</span></div>
  <div class="header-mid">
    <input class="add-input" id="addInput" type="text" placeholder="종목 추가 (AAPL, 삼성전자...)" onkeydown="if(event.key==='Enter')addStock()">
    <button class="add-btn" id="addBtn" onclick="addStock()">+ 추가</button>
  </div>
  <div class="header-right">
    <div class="live-badge" id="liveBadge" style="display:none">
      <div class="live-dot"></div>실시간
    </div>
    <button class="btn-sm" onclick="openSettings()">API 키</button>
  </div>
</div>

<div class="tabs-wrap">
  <div class="tabs">
    <button class="tab active" onclick="switchTab('dashboard')">대시보드</button>
    <button class="tab" onclick="switchTab('screener')">저평가 발굴</button>
  </div>
</div>

<div id="dashView">
  <div class="dash-wrap">
    <div id="detailContainer"></div>
    <div class="dash-grid" id="dashGrid"></div>
  </div>
</div>

<div id="screenerView" style="display:none">
  <div class="screener-wrap">
    <div class="screener-card">
      <div class="screener-title">저평가 종목 발굴</div>
      <div class="screener-desc">분석할 종목을 쉼표로 입력하면 재무제표 기반으로 저평가 여부를 분석합니다.</div>
      <div class="screener-row">
        <input class="screener-input" id="screenerInput" placeholder="AAPL, TSLA, 005930.KS, NVDA" onkeydown="if(event.key==='Enter')runScreener()">
        <button class="screener-btn" id="screenerBtn" onclick="runScreener()">분석 시작</button>
      </div>
      <div class="screener-results" id="screenerResults"></div>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="settingsModal">
  <div class="modal">
    <div class="modal-title">Claude API 키</div>
    <div class="modal-desc">Anthropic Console에서 발급받은 키를 입력하세요. 이 기기에만 저장됩니다.</div>
    <label>API Key</label>
    <input type="password" id="apiKeyInput" placeholder="sk-ant-api03-...">
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeSettings()">취소</button>
      <button class="btn-save" onclick="saveSettings()">저장</button>
    </div>
  </div>
</div>

<script>
// ─── State ───────────────────────────────────────────────
const DEFAULT_TICKERS = ['AAPL','NVDA','TSLA','005930.KS','000660.KS'];
let dashboard = JSON.parse(localStorage.getItem('sa_dash') || 'null') || DEFAULT_TICKERS;
let activeTab = 'dashboard';
let selectedTicker = null;
let refreshTimer = null;
let miniCharts = {};
let detailChart = null;
let aiCache = {};

// ─── Settings ────────────────────────────────────────────
function openSettings(){document.getElementById('apiKeyInput').value=localStorage.getItem('sa_apikey')||'';document.getElementById('settingsModal').classList.add('open')}
function closeSettings(){document.getElementById('settingsModal').classList.remove('open')}
function saveSettings(){const k=document.getElementById('apiKeyInput').value.trim();if(k)localStorage.setItem('sa_apikey',k);closeSettings()}
document.getElementById('settingsModal').addEventListener('click',e=>{if(e.target.classList.contains('modal-backdrop'))closeSettings()});

// ─── Tabs ─────────────────────────────────────────────────
function switchTab(tab){
  activeTab=tab;
  document.querySelectorAll('.tab').forEach((el,i)=>el.classList.toggle('active',['dashboard','screener'][i]===tab));
  document.getElementById('dashView').style.display=tab==='dashboard'?'':'none';
  document.getElementById('screenerView').style.display=tab==='screener'?'':'none';
}

// ─── Ticker normalization ─────────────────────────────────
function normTicker(raw){
  const s=raw.trim().toUpperCase().replace(/\s+/g,'');
  if(/^\d{6}$/.test(s))return s+'.KS';
  const kr={'삼성전자':'005930.KS','삼성':'005930.KS','SK하이닉스':'000660.KS','LG에너지솔루션':'373220.KS',
    '카카오':'035720.KS','네이버':'035420.KS','현대차':'005380.KS','현대자동차':'005380.KS',
    '기아':'000270.KS','셀트리온':'068270.KS','POSCO':'005490.KS','포스코':'005490.KS',
    '삼성바이오로직스':'207940.KS','LG화학':'051910.KS','카카오뱅크':'323410.KS','현대모비스':'012330.KS'};
  return kr[raw.trim()]||s;
}

// ─── Data fetching ────────────────────────────────────────
const PROXIES=[
  url=>'https://api.allorigins.win/raw?url='+encodeURIComponent(url),
  url=>'https://corsproxy.io/?'+encodeURIComponent(url),
  url=>'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(url),
];
async function yf(path){
  const base='https://query1.finance.yahoo.com'+path;
  // try query2 direct (sometimes CORS-open)
  for(const host of['https://query2.finance.yahoo.com','https://query1.finance.yahoo.com']){
    try{
      const r=await fetch(host+path,{signal:AbortSignal.timeout(5000)});
      if(r.ok){const j=await r.json();if(j)return j}
    }catch{}
  }
  // fallback: try proxies
  for(const mkUrl of PROXIES){
    try{
      const r=await fetch(mkUrl(base),{signal:AbortSignal.timeout(8000)});
      if(r.ok){const j=await r.json();if(j)return j}
    }catch{}
  }
  throw new Error('데이터 조회 실패 (네트워크 오류)');
}
async function fetchChart(ticker,range='3mo',interval='1d'){
  const j=await yf(`/v8/finance/chart/${encodeURIComponent(ticker)}?interval=${interval}&range=${range}&includePrePost=false`);
  const r=j.chart?.result?.[0];
  if(!r)throw new Error('종목 없음: '+ticker);
  return r;
}
async function fetchFinancials(ticker){
  try{const j=await yf(`/v10/finance/quoteSummary/${encodeURIComponent(ticker)}?modules=financialData,defaultKeyStatistics,summaryDetail`);return j.quoteSummary?.result?.[0]||{}}catch{return{}}
}

// ─── Claude API ───────────────────────────────────────────
async function callClaude(prompt,maxTokens=900){
  const key=localStorage.getItem('sa_apikey');
  if(!key)throw new Error('API 키 없음. 우측 상단 "API 키"를 설정해주세요.');
  const r=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:maxTokens,messages:[{role:'user',content:prompt}]})
  });
  if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.error?.message||'AI 실패')}
  const d=await r.json();
  const m=d.content[0].text.trim().match(/\{[\s\S]*\}/);
  if(!m)throw new Error('파싱 실패');
  return JSON.parse(m[0]);
}

// ─── Helpers ──────────────────────────────────────────────
function fmtP(n,cur){if(n==null||isNaN(n))return'–';return cur==='KRW'?n.toLocaleString()+'원':'$'+n.toFixed(2)}
function fmt(n){if(n==null||isNaN(n))return'–';if(Math.abs(n)>=1e12)return(n/1e12).toFixed(1)+'T';if(Math.abs(n)>=1e9)return(n/1e9).toFixed(1)+'B';if(Math.abs(n)>=1e6)return(n/1e6).toFixed(1)+'M';return n.toLocaleString()}
function timeStr(){return new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}
function clsChange(v){return v>=0?'up':'down'}
function signStr(v){return v>=0?'+':''}

// ─── Add / Remove stock ───────────────────────────────────
function addStock(){
  const raw=document.getElementById('addInput').value.trim();
  if(!raw)return;
  const ticker=normTicker(raw);
  if(!dashboard.includes(ticker)){
    dashboard.push(ticker);
    saveDash();
    addMiniCard(ticker);
  }
  document.getElementById('addInput').value='';
}
function removeStock(ticker,e){
  if(e){e.stopPropagation()}
  dashboard=dashboard.filter(t=>t!==ticker);
  saveDash();
  if(miniCharts[ticker]){miniCharts[ticker].destroy();delete miniCharts[ticker]}
  const el=document.getElementById('mini-'+ticker);
  if(el)el.remove();
  if(selectedTicker===ticker)closeDetail();
}
function saveDash(){localStorage.setItem('sa_dash',JSON.stringify(dashboard))}

// ─── Mini card ────────────────────────────────────────────
function addMiniCard(ticker){
  const grid=document.getElementById('dashGrid');
  const card=document.createElement('div');
  card.className='stock-mini';
  card.id='mini-'+ticker;
  card.innerHTML=`<div class="mini-loading"><div class="spinner"></div>로딩 중...</div>`;
  card.addEventListener('click',()=>openDetail(ticker));
  grid.appendChild(card);
  loadMiniCard(ticker);
}

async function loadMiniCard(ticker){
  const card=document.getElementById('mini-'+ticker);
  if(!card)return;
  try{
    const r=await fetchChart(ticker,'1mo','1d');
    const meta=r.meta;
    const closes=(r.indicators?.quote?.[0]?.close||[]).filter(c=>c!=null);
    const timestamps=r.timestamp||[];
    const price=meta.regularMarketPrice||meta.previousClose;
    const prev=meta.chartPreviousClose||meta.previousClose;
    const change=price-prev;
    const pct=(change/prev*100);
    const cur=meta.currency;
    const name=(meta.shortName||meta.longName||ticker).replace('Corp.','').replace('Inc.','').replace('Co., Ltd.','').trim();
    const isUp=pct>=0;
    const cls=clsChange(pct);
    const sign=signStr(pct);
    const pe=meta.trailingPE;
    const labels=timestamps.slice(-closes.length).map(t=>{const d=new Date(t*1000);return(d.getMonth()+1)+'/'+d.getDate()});

    card.innerHTML=`
      <button class="mini-remove" onclick="removeStock('${ticker}',event)" title="삭제">✕</button>
      <div class="mini-top">
        <div>
          <div class="mini-name">${name}</div>
          <div class="mini-ticker">${ticker}</div>
        </div>
        <div class="mini-price-wrap">
          <div class="mini-price" id="mp-${ticker}">${fmtP(price,cur)}</div>
          <div class="mini-change ${cls}" id="mc-${ticker}">${sign}${pct.toFixed(2)}%</div>
        </div>
      </div>
      <div class="mini-chart"><canvas id="mc-chart-${ticker}"></canvas></div>
      <div class="mini-meta">
        <span>PER <b>${pe?pe.toFixed(1)+'배':'–'}</b></span>
        <span id="mt-${ticker}" style="font-size:10px;color:var(--text2)"></span>
      </div>`;

    if(miniCharts[ticker]){miniCharts[ticker].destroy()}
    const color=isUp?'#4ade80':'#f87171';
    const ctx=document.getElementById('mc-chart-'+ticker)?.getContext('2d');
    if(ctx){
      miniCharts[ticker]=new Chart(ctx,{
        type:'line',
        data:{labels,datasets:[{data:closes,borderColor:color,backgroundColor:color+'18',fill:true,tension:0.3,pointRadius:0,borderWidth:1.5}]},
        options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{enabled:false}},scales:{x:{display:false},y:{display:false}}}
      });
    }
  }catch(e){
    card.innerHTML=`<div style="padding:16px;font-size:13px;color:var(--red)">${ticker}: 조회 실패</div>`;
  }
}

// ─── Detail panel ─────────────────────────────────────────
async function openDetail(ticker){
  if(selectedTicker===ticker){closeDetail();return}
  document.querySelectorAll('.stock-mini').forEach(c=>c.classList.toggle('selected',c.id==='mini-'+ticker));
  selectedTicker=ticker;
  const container=document.getElementById('detailContainer');
  container.innerHTML=`<div class="detail-panel open" id="detailPanel">
    <div class="mini-loading" style="height:200px"><div class="spinner"></div>로딩 중...</div>
  </div>`;

  try{
    const [r,fin]=await Promise.all([fetchChart(ticker,'3mo','1d'),fetchFinancials(ticker)]);
    const meta=r.meta;
    const closes=(r.indicators?.quote?.[0]?.close||[]);
    const timestamps=r.timestamp||[];
    const price=meta.regularMarketPrice||meta.previousClose;
    const prev=meta.chartPreviousClose||meta.previousClose;
    const change=price-prev;
    const pct=(change/prev*100);
    const cur=meta.currency;
    const name=meta.longName||meta.shortName||ticker;
    const isUp=pct>=0;
    const sign=signStr(pct);
    const cls=clsChange(pct);
    const high52=meta.fiftyTwoWeekHigh,low52=meta.fiftyTwoWeekLow;
    const pe=meta.trailingPE,mktcap=meta.marketCap;
    const validC=closes.filter(c=>c!=null);
    const labels=timestamps.slice(-validC.length).map(t=>{const d=new Date(t*1000);return(d.getMonth()+1)+'/'+d.getDate()});
    const pbr=fin.defaultKeyStatistics?.priceToBook?.fmt||'–';
    const roe=fin.financialData?.returnOnEquity?.fmt||'–';
    const revG=fin.financialData?.revenueGrowth?.fmt||'–';
    const opM=fin.financialData?.operatingMargins?.fmt||'–';
    const de=fin.financialData?.debtToEquity?.fmt||'–';
    const target=fin.financialData?.targetMeanPrice?.fmt||'–';

    container.innerHTML=`<div class="detail-panel open" id="detailPanel">
      <div class="detail-header">
        <div>
          <div class="detail-ticker">${ticker}</div>
          <div class="detail-name">${name}</div>
        </div>
        <div class="detail-price-wrap">
          <div class="detail-price" id="dp-price">${fmtP(price,cur)}</div>
          <div class="detail-change ${cls}" id="dp-change">${sign}${fmtP(Math.abs(change),cur)} (${sign}${pct.toFixed(2)}%)</div>
          <div class="detail-time" id="dp-time">갱신: ${timeStr()}</div>
        </div>
      </div>
      <div class="detail-chart"><canvas id="detailChart"></canvas></div>
      <div class="detail-meta">
        <div class="meta-item"><div class="meta-label">52주 고가</div><div class="meta-value">${fmtP(high52,cur)}</div></div>
        <div class="meta-item"><div class="meta-label">52주 저가</div><div class="meta-value">${fmtP(low52,cur)}</div></div>
        <div class="meta-item"><div class="meta-label">시가총액</div><div class="meta-value">${fmt(mktcap)}</div></div>
        <div class="meta-item"><div class="meta-label">PER</div><div class="meta-value">${pe?pe.toFixed(1)+'배':'–'}</div></div>
        <div class="meta-item"><div class="meta-label">PBR</div><div class="meta-value">${pbr}</div></div>
        <div class="meta-item"><div class="meta-label">ROE</div><div class="meta-value">${roe}</div></div>
        <div class="meta-item"><div class="meta-label">매출성장</div><div class="meta-value">${revG}</div></div>
        <div class="meta-item"><div class="meta-label">영업이익률</div><div class="meta-value">${opM}</div></div>
        <div class="meta-item"><div class="meta-label">목표주가</div><div class="meta-value">${target}</div></div>
      </div>
      <div class="ai-section">
        <div class="ai-header-row"><span class="ai-badge">AI</span><span class="ai-title">종목 분석</span></div>
        <div id="aiResult"><div class="ai-loading"><div class="spinner"></div>AI 분석 중 (호재·악재·전망)...</div></div>
      </div>
      <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">
        <button class="detail-close" onclick="closeDetail()">닫기</button>
      </div>
    </div>`;

    // Detail chart
    if(detailChart){detailChart.destroy()}
    const ctx=document.getElementById('detailChart')?.getContext('2d');
    if(ctx){
      const color=isUp?'#4ade80':'#f87171';
      detailChart=new Chart(ctx,{
        type:'line',
        data:{labels,datasets:[{data:closes,borderColor:color,backgroundColor:color+'18',fill:true,tension:0.3,pointRadius:0,borderWidth:2}]},
        options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>fmtP(c.parsed.y,cur)}}},
          scales:{x:{grid:{color:'#262626'},ticks:{color:'#555',maxTicksLimit:6,font:{size:11}}},
                  y:{grid:{color:'#262626'},ticks:{color:'#555',font:{size:11},callback:v=>fmtP(v,cur)},position:'right'}}}
      });
    }

    // AI analysis (cached)
    if(aiCache[ticker]){
      renderAI(aiCache[ticker]);
    }else{
      const metaForAI={name,price,currency:cur,changePercent:pct.toFixed(2),
        high52:fmtP(high52,cur),low52:fmtP(low52,cur),marketCap:fmt(mktcap),
        pe:pe?pe.toFixed(1):'–'};
      const prompt=`다음 주식 정보를 분석하고 JSON만 반환해 (순수 JSON, 설명 없이).

종목: ${name} (${ticker})
현재가: ${fmtP(price,cur)}, 등락: ${sign}${pct.toFixed(2)}%
PER: ${metaForAI.pe}, PBR: ${pbr}, ROE: ${roe}
영업이익률: ${opM}, 매출성장: ${revG}, 부채비율: ${de}
목표주가: ${target}, 시가총액: ${metaForAI.marketCap}

{
  "verdict": "BUY"|"SELL"|"HOLD",
  "verdict_reason": "핵심 이유 한 문장 (한국어)",
  "undervaluation_score": 0~100 정수,
  "undervaluation_comment": "저평가/고평가 판단 한 문장 (한국어)",
  "positives": ["호재1","호재2","호재3"],
  "negatives": ["악재1","악재2","악재3"],
  "outlook": "6~12개월 전망 2~3문장 (한국어)"
}`;
      callClaude(prompt).then(ai=>{aiCache[ticker]=ai;renderAI(ai)}).catch(e=>{
        const el=document.getElementById('aiResult');
        if(el)el.innerHTML=`<div class="error-box">${e.message}</div>`;
      });
    }
  }catch(e){
    container.innerHTML=`<div class="detail-panel open" id="detailPanel"><div class="error-box">${e.message}</div><button class="detail-close" style="margin-top:14px" onclick="closeDetail()">닫기</button></div>`;
  }
}

function renderAI(ai){
  const el=document.getElementById('aiResult');
  if(!el)return;
  const vClass={BUY:'verdict-buy',SELL:'verdict-sell',HOLD:'verdict-hold'}[ai.verdict]||'verdict-hold';
  const vLabel={BUY:'매수',SELL:'매도',HOLD:'중립'}[ai.verdict]||ai.verdict;
  const score=ai.undervaluation_score??50;
  const sc=score>=65?'var(--accent)':score>=40?'var(--yellow)':'var(--red)';
  const pos=(ai.positives||[]).map(p=>`<li>${p}</li>`).join('');
  const neg=(ai.negatives||[]).map(n=>`<li>${n}</li>`).join('');
  el.innerHTML=`
    <div class="verdict">
      <div class="verdict-badge ${vClass}">${vLabel}</div>
      <div class="verdict-text">${ai.verdict_reason}</div>
    </div>
    <div class="uv-row">
      <div class="uv-label">저평가 지수</div>
      <div class="uv-bar-wrap"><div class="uv-bar" style="width:${score}%;background:${sc}"></div></div>
      <div class="uv-score" style="color:${sc}">${score}</div>
    </div>
    <div style="font-size:12px;color:var(--text2);margin-bottom:12px;padding:0 2px">${ai.undervaluation_comment}</div>
    <div class="factors-grid">
      <div class="factor-box">
        <div class="factor-label label-pos">▲ 호재</div>
        <ul class="factor-list">${pos}</ul>
      </div>
      <div class="factor-box">
        <div class="factor-label label-neg">▼ 악재</div>
        <ul class="factor-list">${neg}</ul>
      </div>
    </div>
    <div class="outlook-box">
      <div class="outlook-label">→ 향후 전망 (6~12개월)</div>
      <div class="outlook-text">${ai.outlook}</div>
    </div>`;
}

function closeDetail(){
  selectedTicker=null;
  document.querySelectorAll('.stock-mini').forEach(c=>c.classList.remove('selected'));
  document.getElementById('detailContainer').innerHTML='';
  if(detailChart){detailChart.destroy();detailChart=null}
}

// ─── Live price refresh ────────────────────────────────────
async function refreshAllPrices(){
  for(const ticker of dashboard){
    try{
      const j=await yf(`/v8/finance/chart/${encodeURIComponent(ticker)}?interval=1m&range=1d`);
      const meta=j.chart?.result?.[0]?.meta;
      if(!meta)continue;
      const price=meta.regularMarketPrice||meta.previousClose;
      const prev=meta.chartPreviousClose||meta.previousClose;
      const pct=((price-prev)/prev*100);
      const cur=meta.currency;
      const sign=signStr(pct);
      const cls=clsChange(pct);
      const mp=document.getElementById('mp-'+ticker);
      const mc=document.getElementById('mc-'+ticker);
      if(mp)mp.textContent=fmtP(price,cur);
      if(mc){mc.textContent=sign+pct.toFixed(2)+'%';mc.className='mini-change '+cls}
      const mt=document.getElementById('mt-'+ticker);
      if(mt)mt.textContent=timeStr();
      // Also update detail if open
      if(selectedTicker===ticker){
        const dp=document.getElementById('dp-price');
        const dc=document.getElementById('dp-change');
        const dt=document.getElementById('dp-time');
        const change=price-prev;
        if(dp)dp.textContent=fmtP(price,cur);
        if(dc){dc.textContent=sign+fmtP(Math.abs(change),cur)+' ('+sign+pct.toFixed(2)+'%)';dc.className='detail-change '+cls}
        if(dt)dt.textContent='갱신: '+timeStr();
      }
    }catch{}
  }
}

// ─── Screener ─────────────────────────────────────────────
async function runScreener(){
  const raw=document.getElementById('screenerInput').value;
  const tickers=raw.split(',').map(t=>normTicker(t.trim())).filter(Boolean);
  if(!tickers.length)return;
  const btn=document.getElementById('screenerBtn');
  btn.disabled=true;btn.textContent='분석 중...';
  const res=document.getElementById('screenerResults');
  res.innerHTML=`<div class="ai-loading"><div class="spinner"></div>${tickers.length}개 종목 분석 중...</div>`;
  const items=[];
  for(const ticker of tickers){
    try{
      const [cd,fin]=await Promise.all([fetchChart(ticker,'1mo','1d'),fetchFinancials(ticker)]);
      const meta=cd.meta;
      const price=meta.regularMarketPrice||meta.previousClose;
      const cur=meta.currency;
      const name=meta.shortName||meta.longName||ticker;
      const pe=meta.trailingPE;
      const pbr=fin.defaultKeyStatistics?.priceToBook?.raw;
      const roe=fin.financialData?.returnOnEquity?.raw;
      const revG=fin.financialData?.revenueGrowth?.raw;
      const opM=fin.financialData?.operatingMargins?.raw;
      const target=fin.financialData?.targetMeanPrice?.raw;
      const prompt=`저평가 판단 JSON만 반환.
${name}(${ticker}) 현재가:${fmtP(price,cur)} PER:${pe?.toFixed(1)||'–'} PBR:${pbr?.toFixed(2)||'–'} ROE:${roe?(roe*100).toFixed(1)+'%':'–'} 매출성장:${revG?(revG*100).toFixed(1)+'%':'–'} 영업이익률:${opM?(opM*100).toFixed(1)+'%':'–'} 목표주가:${target?fmtP(target,cur):'–'}
{"undervaluation_score":0~100정수,"reason":"이유 2문장(한국어)"}`;
      const ai=await callClaude(prompt,400);
      items.push({ticker,name,price,cur,pe,pbr,roe,revG,opM,score:ai.undervaluation_score,reason:ai.reason});
    }catch(e){items.push({ticker,name:ticker,error:e.message})}
  }
  items.sort((a,b)=>(b.score||0)-(a.score||0));
  res.innerHTML=items.map(item=>{
    if(item.error)return`<div class="screener-item"><div class="screener-item-top"><span class="screener-item-name">${item.ticker}</span><span style="color:var(--red);font-size:12px">오류</span></div><div class="screener-reason">${item.error}</div></div>`;
    const score=item.score??0;
    const sc=score>=65?'s-high':score>=40?'s-mid':'s-low';
    return`<div class="screener-item" onclick="addAndView('${item.ticker}')">
      <div class="screener-item-top">
        <span class="screener-item-name">${item.name}<span class="screener-item-sub">${item.ticker}</span></span>
        <span class="s-score ${sc}">저평가 ${score}점</span>
      </div>
      <div class="screener-metrics">
        <div>현재가<span>${fmtP(item.price,item.cur)}</span></div>
        ${item.pe?`<div>PER<span>${item.pe.toFixed(1)}배</span></div>`:''}
        ${item.pbr?`<div>PBR<span>${item.pbr.toFixed(2)}배</span></div>`:''}
        ${item.roe?`<div>ROE<span>${(item.roe*100).toFixed(1)}%</span></div>`:''}
        ${item.revG?`<div>매출성장<span>${(item.revG*100).toFixed(1)}%</span></div>`:''}
      </div>
      <div class="screener-reason">${item.reason}</div>
    </div>`;
  }).join('');
  btn.disabled=false;btn.textContent='분석 시작';
}

function addAndView(ticker){
  if(!dashboard.includes(ticker)){dashboard.push(ticker);saveDash();addMiniCard(ticker)}
  switchTab('dashboard');
  setTimeout(()=>openDetail(ticker),300);
}

// ─── Init ─────────────────────────────────────────────────
(function init(){
  if(!localStorage.getItem('sa_apikey'))openSettings();
  const grid=document.getElementById('dashGrid');
  if(dashboard.length===0){
    grid.innerHTML=`<div class="empty-state" style="grid-column:1/-1"><p>위에서 종목을 추가하면<br>대시보드에 항상 표시됩니다.</p></div>`;
    return;
  }
  dashboard.forEach(addMiniCard);
  document.getElementById('liveBadge').style.display='flex';
  refreshTimer=setInterval(refreshAllPrices,30000);
})();
</script>
